<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Global Strategy Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <!-- Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #1E170F; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #map { position: absolute; top: 0; left: 300px; right: 0; bottom: 0; }
    #sidebar {
      position: absolute; top: 0; left: 0; bottom: 0; width: 300px;
      overflow-y: auto; background: #2c3e50; color: white; padding: 15px;
      box-shadow: 3px 0 10px rgba(0,0,0,0.5); z-index: 1000;
    }
    #sidebar.hidden { display: none; }
    #toggleSidebar {
      position: absolute; top: 15px; left: 10px; z-index: 1100;
      background: #34495e; color: white; border: none; padding: 10px;
      cursor: pointer; font-size: 16px; box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
    }
    .custom-div-icon span {
      font-size: 24px;
      line-height: 24px;
      display: block;
      text-align: center;
    }
    button { background: #2980b9; color: white; border: none; padding: 8px; cursor: pointer; }
    input, select, textarea { width: 100%; margin: 5px 0; padding: 5px; }
    label { display: block; margin: 5px 0; color: white; }
    .collapsible { background: #34495e; color: white; cursor: pointer; padding: 8px; width: 100%; text-align: left; border: none; }
    .collapsible:after { content: '\002B'; float: right; }
    .collapsible.active:after { content: '\2212'; }
    .content { display: none; background: #2c3e50; padding: 5px; }
    .content.show { display: block; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center;
      justify-content: center; z-index: 2000;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: #2c3e50; padding: 20px; width: 320px; max-height: 90%;
      overflow-y: auto; position: relative; border-radius: 8px; color: white;
    }
    .modal-close {
      position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 20px;
    }
    .subfields { margin-left: 10px; border-left: 2px solid #34495e; padding-left: 8px; }
  </style>
</head>
<body>
  <button id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
  <div id="sidebar" class="hidden" role="complementary">
    <input type="text" id="searchInput" placeholder="Search markers..." aria-label="Search markers">
    <button class="collapsible">Marker Management</button>
    <div class="content">
      <form id="markerForm">
        <label>Type
          <select id="markerType">
            <option value="player">Player</option>
            <option value="town">Town</option>
            <option value="poi">POI</option>
            <option value="army">Army</option>
          </select>
        </label>
        <label>Name<input type="text" id="markerName"></label>
        <div id="iconFields">
          <label>Icon URL<input type="text" id="markerIcon"></label>
          <label>Icon File<input type="file" id="markerIconFile" accept="image/*"></label>
        </div>
        <div id="townFields" style="display:none;">
          <label>Town Size
            <select id="townSize">
              <option value="capital">Capital</option>
              <option value="city">City</option>
              <option value="village">Village</option>
            </select>
          </label>
        </div>
        <div id="armyFields" style="display:none;">
          <label>Nation<input type="text" id="armyNation"></label>
          <label>Unit Type<input type="text" id="armyUnitType"></label>
          <label>Attack<input type="number" id="armyAttack"></label>
          <label>Defend<input type="number" id="armyDefend"></label>
          <label>Action Points<input type="number" id="armyActionPoints"></label>
          <label>Range<input type="number" id="armyRange"></label>
          <label>Movement<input type="number" id="armyMovement"></label>
          <label>AP1<input type="text" id="armyAP1"></label>
          <label>AP2<input type="text" id="armyAP2"></label>
          <label>AP3<input type="text" id="armyAP3"></label>
          <label>Ability Desc<textarea id="armyAbilityDesc" rows="2"></textarea></label>
        </div>
        <label>Tooltip Type
          <select id="markerTooltipType" onchange="toggleTooltip()">
            <option value="image">Image</option>
            <option value="text">Text</option>
          </select>
        </label>
        <label>Tooltip Content<input type="text" id="markerTooltip"></label>
        <label>Tooltip File<input type="file" id="markerTooltipFile" accept="image/*"></label>
        <label><input type="checkbox" id="markerAdminOnly"> Admin Only</label>
        <button type="button" id="addMarkerBtn">Add Marker</button>
      </form>
    </div>

    <button class="collapsible">Town &amp; POI Markers</button>
    <div class="content"><ul id="markerList"></ul></div>

    <button class="collapsible">Player Markers</button>
    <div class="content"><ul id="playerMarkerList"></ul></div>
  </div>

  <div id="map" role="application"></div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <span id="closeEditModalBtn" class="modal-close" aria-label="Close">&times;</span>
      <h2>Edit Marker</h2>
      <form id="editForm">
        <input type="hidden" id="editId">
        <label>Name<input type="text" id="editName"></label>
        <label>Type
          <select id="editType" disabled>
            <option value="player">Player</option>
            <option value="town">Town</option>
            <option value="poi">POI</option>
            <option value="army">Army</option>
          </select>
        </label>
        <label>Icon URL<input type="text" id="editIconUrl"></label>
        <label>Tooltip Type
          <select id="editTooltipType">
            <option value="image">Image</option>
            <option value="text">Text</option>
          </select>
        </label>
        <label>Tooltip Content<input type="text" id="editTooltipContent"></label>
        <div id="editTownFields" class="subfields hidden">
          <label>Town Size
            <select id="editTownSize">
              <option value="capital">Capital</option>
              <option value="city">City</option>
              <option value="village">Village</option>
            </select>
          </label>
        </div>
        <div id="editArmyFields" class="subfields hidden">
          <label>Nation<input type="text" id="editNation"></label>
          <label>Unit Type<input type="text" id="editUnitType"></label>
          <label>Attack<input type="number" id="editAttack"></label>
          <label>Defend<input type="number" id="editDefend"></label>
          <label>Action Points<input type="number" id="editActionPoints"></label>
          <label>Range<input type="number" id="editRange"></label>
          <label>Movement<input type="number" id="editMovement"></label>
          <label>AP1<input type="text" id="editAP1"></label>
          <label>AP2<input type="text" id="editAP2"></label>
          <label>AP3<input type="text" id="editAP3"></label>
          <label>Ability Desc<textarea id="editAbilityDesc" rows="2"></textarea></label>
        </div>
        <label><input type="checkbox" id="editAdminOnly"> Admin Only</label>
        <button type="button" id="saveEditBtn">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-storage.js"></script>

  <script>
  (function() {
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCo9QPVrLCXS6li_kcTu3e-GOoiiwpHvLs",
    authDomain: "woe-world.firebaseapp.com",
    databaseURL: "https://woe-world-default-rtdb.firebaseio.com",
    projectId: "woe-world",
    storageBucket: "woe-world.appspot.com",
    messagingSenderId: "706865712365",
    appId: "1:706865712365:web:e080b1ef45b8d8b27190e4",
    measurementId: "G-789BN2WECG"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const storage = firebase.storage();

  // Initialize map
  const map = L.map('map', { crs: L.CRS.Simple, maxZoom: 2, minZoom: -2 });
  const imageBounds = [[0, 0], [3996, 5729]];
  L.imageOverlay('assets/high_res_image.png', imageBounds).addTo(map);
  map.fitBounds(imageBounds);

  // Marker clustering
  const clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 50,
    disableClusteringAtZoom: map.getMaxZoom()
  });
  map.addLayer(clusterGroup);

  // Player layer
  const playerLayer = L.layerGroup();
  map.addLayer(playerLayer);

  // Icon cache
  const iconCache = {};
  function getIcon(url, size) {
    const key = `${url}|${size[0]}x${size[1]}`;
    if (!iconCache[key]) {
      iconCache[key] = L.icon({ iconUrl: url, iconSize: size, iconAnchor: [size[0]/2, size[1]] });
    }
    return iconCache[key];
  }

  // Utility functions
  function debounce(fn, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => fn.apply(this, args), wait);
    };
  }
  function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

  // Marker schemas
  const markerSchemas = {
    player: {
      formFields: ['markerIcon', 'markerIconFile', 'markerTooltipType', 'markerTooltip', 'markerTooltipFile', 'markerAdminOnly'],
      popupFields: ['markerTooltip']
    },
    town: {
      formFields: ['townSize', 'markerTooltipType', 'markerTooltip', 'markerTooltipFile', 'markerAdminOnly'],
      popupFields: ['townSize', 'markerTooltip']
    },
    army: {
      formFields: [
        'markerIcon','markerIconFile',
        'armyNation','armyUnitType','armyAttack','armyDefend','armyActionPoints','armyRange','armyMovement','armyAP1','armyAP2','armyAP3','armyAbilityDesc',
        'markerTooltipType','markerTooltip','markerTooltipFile','markerAdminOnly'
      ],
      popupFields: [
        'armyNation','armyUnitType','armyAttack','armyDefend','armyActionPoints','armyRange','armyMovement','armyAP1','armyAP2','armyAP3','armyAbilityDesc','markerTooltip'
      ]
    },
    default: {
      formFields: ['markerTooltipType','markerTooltip','markerTooltipFile','markerAdminOnly'],
      popupFields: ['markerTooltip']
    }
  };

  // Field labels
  const fieldLabels = {
    markerTooltip: 'Tooltip',
    townSize: 'Town Size',
    armyNation: 'Nation',
    armyUnitType: 'Unit Type',
    armyAttack: 'Attack',
    armyDefend: 'Defense',
    armyActionPoints: 'Action Points',
    armyRange: 'Range',
    armyMovement: 'Movement',
    armyAP1: 'AP1',
    armyAP2: 'AP2',
    armyAP3: 'AP3',
    armyAbilityDesc: 'Ability Desc'
  };

  // Cache DOM references
  const refs = {
    markerType: document.getElementById('markerType'),
    markerName: document.getElementById('markerName'),
    markerIcon: document.getElementById('markerIcon'),
    markerIconFile: document.getElementById('markerIconFile'),
    markerTooltipType: document.getElementById('markerTooltipType'),
    markerTooltip: document.getElementById('markerTooltip'),
    markerTooltipFile: document.getElementById('markerTooltipFile'),
    markerAdminOnly: document.getElementById('markerAdminOnly'),
    townSize: document.getElementById('townSize'),
    armyNation: document.getElementById('armyNation'),
    armyUnitType: document.getElementById('armyUnitType'),
    armyAttack: document.getElementById('armyAttack'),
    armyDefend: document.getElementById('armyDefend'),
    armyActionPoints: document.getElementById('armyActionPoints'),
    armyRange: document.getElementById('armyRange'),
    armyMovement: document.getElementById('armyMovement'),
    armyAP1: document.getElementById('armyAP1'),
    armyAP2: document.getElementById('armyAP2'),
    armyAP3: document.getElementById('armyAP3'),
    armyAbilityDesc: document.getElementById('armyAbilityDesc'),

    markerList: document.getElementById('markerList'),
    playerMarkerList: document.getElementById('playerMarkerList'),
    searchInput: document.getElementById('searchInput'),

    editModal: document.getElementById('editModal'),
    editId: document.getElementById('editId'),
    editName: document.getElementById('editName'),
    editType: document.getElementById('editType'),
    editIconUrl: document.getElementById('editIconUrl'),
    editTooltipType: document.getElementById('editTooltipType'),
    editTooltipContent: document.getElementById('editTooltipContent'),
    editTooltipFile: document.getElementById('editTooltipFile'),
    editTownSize: document.getElementById('editTownSize'),
    editNation: document.getElementById('editNation'),
    editUnitType: document.getElementById('editUnitType'),
    editAttack: document.getElementById('editAttack'),
    editDefend: document.getElementById('editDefend'),
    editActionPoints: document.getElementById('editActionPoints'),
    editRange: document.getElementById('editRange'),
    editMovement: document.getElementById('editMovement'),
    editAP1: document.getElementById('editAP1'),
    editAP2: document.getElementById('editAP2'),
    editAP3: document.getElementById('editAP3'),
    editAbilityDesc: document.getElementById('editAbilityDesc'),
    saveEditBtn: document.getElementById('saveEditBtn')
  };

  let hasEditPermissions = false;
  const markers = {};

  // Helper: render popup HTML
  function renderPopup(d) {
    const schema = markerSchemas[d.type] || markerSchemas.default;
    return schema.popupFields.map(fieldId => {
      const label = fieldLabels[fieldId] || fieldId;
      const val = d[fieldId] || '';
      return `<strong>${label}</strong> ${val}`;
    }).join('<br>');
  }

  // Admin buttons in popup
  function getAdminOptions(d) {
    if (!hasEditPermissions) return '';
    return `
      <button onclick="openEditModal('${d.id}')">✎</button>
      <button onclick="duplicateMarker('${d.id}')">⧉</button>
      <label><input type="checkbox" ${d.adminOnly ? 'checked' : ''} onclick="toggleAdminOnly('${d.id}', this.checked)"> Admin Only</label>
    `;
  }

  // Load and render markers
  database.ref('markers').on('value', snapshot => {
    clusterGroup.clearLayers();
    playerLayer.clearLayers();
    Object.values(snapshot.val() || {}).forEach(raw => {
      const d = correctMarkerData(raw);
      markers[d.id] = d;
      const icon = getIcon(d.iconUrl, d.iconSize || [32,32]);
      const m = L.marker([d.lat, d.lng], { icon, data: d });
      m.bindPopup(renderPopup(d) + getAdminOptions(d));
      if (d.adminOnly && !hasEditPermissions) return;
      if (d.type === 'player') playerLayer.addLayer(m);
      else clusterGroup.addLayer(m);
    });
    updateSidebar();
  });

  // Sidebar update (with DocumentFragment)
  function updateSidebar() {
    const search = refs.searchInput.value.toLowerCase();
    const frag = document.createDocumentFragment();
    Object.values(markers).forEach(d => {
      if (!d.name.toLowerCase().includes(search)) return;
      const li = document.createElement('li');
      li.textContent = d.name;
      if (hasEditPermissions) {
        const e = document.createElement('button'); e.textContent='✎'; e.onclick=() => openEditModal(d.id); li.append(e);
        const r = document.createElement('button'); r.textContent='🗑'; r.onclick=() => removeMarker(d.id); li.append(r);
      }
      li.onclick = () => map.setView([d.lat, d.lng], map.getZoom());
      if (d.type === 'player') refs.playerMarkerList.appendChild(li);
      else frag.appendChild(li);
    });
    refs.markerList.replaceChildren(frag);
  }

  // Show/hide form sections
  function toggleFields() {
    ['iconFields','townFields','armyFields'].forEach(id => document.getElementById(id).style.display='none');
    const schema = markerSchemas[refs.markerType.value] || markerSchemas.default;
    if (schema.formFields.includes('markerIcon')) document.getElementById('iconFields').style.display='block';
    if (schema.formFields.includes('townSize')) document.getElementById('townFields').style.display='block';
    if (schema.formFields.some(f => f.startsWith('army'))) document.getElementById('armyFields').style.display='block';
    toggleTooltip();
  }

  function toggleTooltip() {
    refs.markerTooltip.style.display = refs.markerTooltipType.value==='text'?'block':'none';
    refs.markerTooltipFile.style.display = refs.markerTooltipType.value==='image'?'block':'none';
  }

  // Add new marker
  function addMarker() {
    const type = refs.markerType.value;
    const schema = markerSchemas[type] || markerSchemas.default;
    const id = database.ref().child('markers').push().key;
    const center = map.getCenter();
    const d = { id, type, name: refs.markerName.value, lat: center.lat, lng: center.lng };
    schema.formFields.forEach(fid => {
      const el = document.getElementById(fid);
      if (!el || el.type==='file') return;
      d[fid] = el.type==='checkbox'? el.checked : el.value;
    });
    // TODO: handle file uploads for icon and tooltip images
    database.ref('markers/'+id).set(d);
  }

  // Edit modal
  window.openEditModal = function(id) {
    const d = markers[id];
    refs.editId.value = d.id;
    refs.editName.value = d.name;
    refs.editType.value = d.type;
    const schema = markerSchemas[d.type] || markerSchemas.default;
    schema.formFields.forEach(fid => {
      const el = document.getElementById(fid);
      const editEl = document.getElementById('edit'+ capitalize(fid));
      if (editEl) {
        if (editEl.type==='checkbox') editEl.checked = d[fid];
        else editEl.value = d[fid] || '';
      }
    });
    document.getElementById('editTownFields').classList.toggle('hidden', !schema.formFields.includes('townSize'));
    document.getElementById('editArmyFields').classList.toggle('hidden', !schema.formFields.some(f=>f.startsWith('army')));
    refs.editModal.classList.remove('hidden');
  };

  // Save changes
  refs.saveEditBtn.addEventListener('click', () => {
    const id = refs.editId.value;
    const type = refs.editType.value;
    const schema = markerSchemas[type] || markerSchemas.default;
    const upd = { id, type, name: refs.editName.value };
    schema.formFields.forEach(fid => {
      const editEl = document.getElementById('edit'+ capitalize(fid));
      if (!editEl) return;
      upd[fid] = editEl.type==='checkbox'? editEl.checked : editEl.value;
    });
    database.ref('markers/'+id).set(upd).then(() => refs.editModal.classList.add('hidden'));
  });

  // Duplicate & remove
  window.duplicateMarker = function(id) {
    const orig = markers[id];
    const copy = { ...orig, id: database.ref().child('markers').push().key, name: orig.name + ' Copy' };
    delete copy.lat; delete copy.lng;
    database.ref('markers/'+copy.id).set(copy);
  };
  window.removeMarker = function(id) { database.ref('markers/'+id).remove(); };
  window.toggleAdminOnly = function(id, val) { database.ref('markers/'+id+'/adminOnly').set(val); };

  // Event listeners
  refs.markerType.addEventListener('change', debounce(toggleFields, 100));
  refs.markerTooltipType.addEventListener('change', toggleTooltip);
  document.getElementById('addMarkerBtn').addEventListener('click', addMarker);
  refs.searchInput.addEventListener('input', debounce(updateSidebar, 200));

  // Fetch IP for permissions
  fetch('https://api.ipify.org?format=json')
    .then(r=>r.json())
    .then(data => { const allow = ['24.57.218.92','75.91.235.226']; hasEditPermissions = allow.includes(data.ip); });

  // Initialize form state
  toggleFields(); toggleTooltip();
})();
  </script>
</body>
</html>
