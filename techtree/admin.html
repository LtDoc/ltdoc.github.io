<html>

<body>

  <section>

      }

    // Add Research
    addResearchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const tree = treeSelect.value;
      const branch = branchSelect.value;
      const name = document.getElementById('nameInput').value.trim();
      const year = parseInt(yearSelect.value);
      const cost = parseInt(document.getElementById('costInput').value);
      const image = document.getElementById('imageInput').value.trim();
      const desc = document.getElementById('descInput').value.trim();
      const stats = document.getElementById('statsInput').value.trim();

      if (!branch || !name) {
        alert('Branch and Name required!');
        return;
      }

      // Auto-calc prerequisites
      const prevRangeStart = year - 5;
      let prereqs = [];
      const branchRef = ref(db, `research_tree/${tree}/${branch}`);
      const branchSnap = await get(branchRef);
      if (branchSnap.exists()) {
        for (let tname in branchSnap.val()) {
          let tech = branchSnap.val()[tname];

          }

    // Add / Edit Nation
    addNationForm.addEventListener('submit', async (e) => {

      if (!name) {

      }
      await set(nationRef, {

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <p id="modalMessage"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
function showModal(message, buttons = [{ text: "OK" }]) {
  const modal = document.getElementById('modal');
  const modalMsg = document.getElementById('modalMessage');
  const modalActions = document.getElementById('modalActions');
  modalMsg.textContent = message;
  modalActions.innerHTML = '';
  buttons.forEach(btn => {
    const b = document.createElement('button');
    b.textContent = btn.text;
    b.onclick = () => {
      hideModal();
      if (btn.action) btn.action();
    };
    modalActions.appendChild(b);

  modal.classList.remove('hidden');
}
function hideModal() {
  document.getElementById('modal').classList.add('hidden');
}
</script>

<div id="prereqModal" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;">
