
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><title>WW1 Tech Tree Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
  <!-- Modal for prerequisites -->
  <div id="prereqModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;" class="hidden">
    <div style="background:#fff;padding:20px;border:2px solid #333;width:400px;max-height:80%;overflow:auto;">
      <h3>Select Prerequisites</h3>
      <input type="text" id="prereqSearch" placeholder="Search..." style="width:100%;margin-bottom:8px;">
      <div id="prereqResults" style="border:1px solid #ccc;max-height:200px;overflow-y:auto;margin-bottom:10px;padding:5px;"></div>
      <h4>Selected:</h4>
      <div id="modalSelected" style="border:1px solid #ccc;max-height:200px;overflow-y:auto;margin-bottom:10px;padding:5px;"></div>
      <button id="prereqDoneBtn">Done</button>
      <button class="modal-close">Cancel</button>
    </div>
  </div>

  <h1>Admin Panel</h1>
  <!-- Add Branch Section -->
  <section>
    <h2>Add Branch</h2>
    <label>Tree:
      <select id="branchTreeFormSelect">
        <option value="Navy">Navy</option>
        <option value="Army">Army</option>
        <option value="Engineering">Engineering</option>
        <option value="Society">Society</option>
      </select>
    </label><br>
    <label>Branch Name:
      <input type="text" id="branchNameInput" placeholder="e.g. Battleships">
    </label><br>
    <button id="addBranchBtn">Add Branch</button>
  </section>
  <hr>

  <!-- Add Research Item -->
  <section>
    <h2>Add / Edit Research Item</h2>
    <label>Tree:
      <select id="treeSelect">
        <option value="Navy">Navy</option>
        <option value="Army">Army</option>
        <option value="Engineering">Engineering</option>
        <option value="Society">Society</option>
      </select>
    </label><br>
    <label>Branch:
      <select id="branchSelect"></select>
    </label><br>
    <label>Name: <input type="text" id="nameInput"></label><br>
    <label>Year: <select id="yearInput"></select></label><br>
    <label>RP Cost: <input type="number" id="costInput"></label><br>
    <label>$ Cost: <input type="number" id="moneyCostInput" value="100"></label><br>
    <label>Image URL: <input type="text" id="imageInput"></label><br>
    <label>Description:<br><textarea id="descInput" rows="6"></textarea></label><br>
    <label>Stats:<br><textarea id="statsInput" rows="2"></textarea></label><br>
    <div id="prereqContainer">
      <strong>Prerequisites:</strong><div id="prereqList"></div>
      <button id="addPrereqBtn">+ Add Prerequisite</button>
    </div><br>
    <button id="saveResearchBtn">Save Research</button>
  </section>

  <hr>
  <!-- Manage Existing Items -->
  <section>
    <h2>Manage Existing Items</h2>
    <label>Tree:
      <select id="manageTreeSelect">
        <option value="Navy">Navy</option>
        <option value="Army">Army</option>
        <option value="Engineering">Engineering</option>
        <option value="Society">Society</option>
      </select>
    </label>
    <label>Branch:
      <select id="manageBranchSelect"></select>
    </label>
    <button id="loadItemsBtn">Load Items</button>
    <div id="itemsList"></div>
  </section>

  <hr>
  <!-- Add/Edit Nation -->
  <section>
    <h2>Add / Edit Nation</h2>
    <label>Name: <input type="text" id="nationNameInput"></label><br>
    <label>RP/week: <input type="number" id="rpWeekInput"></label><br>
    <label>Banked RP: <input type="number" id="bankedInput"></label><br>
    <label>Password: <input type="text" id="nationPassInput"></label><br>
    <button id="saveNationBtn">Save Nation</button>
  </section>

  <script type="module">
    import { db } from './firebase.js';
    import { ref, get, set, remove } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js';

    document.addEventListener('DOMContentLoaded', () => {
      const branchTreeFormSelect = document.getElementById('branchTreeFormSelect');
      const branchNameInput = document.getElementById('branchNameInput');
      const addBranchBtn = document.getElementById('addBranchBtn');
      const treeSelect = document.getElementById('treeSelect');
      const branchSelect = document.getElementById('branchSelect');
      const yearSelect = document.getElementById('yearInput');
      const costInput = document.getElementById('costInput');
      const moneyCostInput = document.getElementById('moneyCostInput');
      const imageInput = document.getElementById('imageInput');
      const descInput = document.getElementById('descInput');
      const statsInput = document.getElementById('statsInput');
      const saveResearchBtn = document.getElementById('saveResearchBtn');
      const manageTreeSelect = document.getElementById('manageTreeSelect');
      const manageBranchSelect = document.getElementById('manageBranchSelect');
      const loadItemsBtn = document.getElementById('loadItemsBtn');
      const itemsList = document.getElementById('itemsList');
      const nationNameInput = document.getElementById('nationNameInput');
      const rpWeekInput = document.getElementById('rpWeekInput');
      const bankedInput = document.getElementById('bankedInput');
      const nationPassInput = document.getElementById('nationPassInput');
      const saveNationBtn = document.getElementById('saveNationBtn');
      const addPrereqBtn = document.getElementById('addPrereqBtn');
      const prereqModal = document.getElementById('prereqModal');
      const prereqSearch = document.getElementById('prereqSearch');
      const prereqResults = document.getElementById('prereqResults');
      const modalSelected = document.getElementById('modalSelected');
      const prereqDoneBtn = document.getElementById('prereqDoneBtn');
      const closeBtns = document.querySelectorAll('.modal-close');

      // Populate years
      for(let y=1850;y<=1925;y++){ let o=document.createElement('option'); o.value=y; o.textContent=y; yearSelect.appendChild(o); }

      // Load branches
      async function loadBranches(tree, sel){
        sel.innerHTML='';
        const s=await get(ref(db,`branches/${tree}`));
        if(s.exists()) s.val().forEach(b=>sel.appendChild(Object.assign(document.createElement('option'),{value:b,textContent:b})));
      }
      loadBranches(treeSelect.value,branchSelect);
      loadBranches(manageTreeSelect.value,manageBranchSelect);
      treeSelect.onchange=()=>loadBranches(treeSelect.value,branchSelect);
      manageTreeSelect.onchange=()=>loadBranches(manageTreeSelect.value,manageBranchSelect);

      // Add branch
      addBranchBtn.onclick=async()=>{
        const tree=branchTreeFormSelect.value, name=branchNameInput.value.trim();
        if(!name) return alert('Branch name required!');
        const refb=ref(db,`branches/${tree}`);
        const snap=await get(refb);
        const arr=snap.exists()?snap.val():[];
        if(arr.includes(name)) return alert('Branch exists');
        arr.push(name);
        await set(refb,arr);
        alert(`Added branch ${name} to ${tree}`);
        branchNameInput.value='';
        loadBranches(treeSelect.value,branchSelect);
        loadBranches(manageTreeSelect.value,manageBranchSelect);
      };

      // Add/edit research
      saveResearchBtn.onclick=async()=>{
        const tree=treeSelect.value, branch=branchSelect.value, name=document.getElementById('nameInput').value.trim();
        if(!branch||!name) return alert('Branch and Name required!');
        const year=+yearSelect.value, cost=+costInput.value, moneyCost=+moneyCostInput.value||100;
        const image=imageInput.value.trim(), desc=descInput.value.trim(), stats=statsInput.value.trim();
        const prereqs=[...document.querySelectorAll('#prereqList .prereq-item')].map(e=>e.dataset.name);
        await set(ref(db,`research_tree/${tree}/${branch}/${name}`),{year,cost,moneyCost,image,description:desc,stats,prerequisites:prereqs});
        alert(`${name} saved`);
      };

      // Manage items
      loadItemsBtn.onclick=async()=>{
        const t=manageTreeSelect.value, b=manageBranchSelect.value;
        const s=await get(ref(db,`research_tree/${t}/${b}`));
        itemsList.innerHTML='';
        if(!s.exists()) return itemsList.textContent='No items';
        Object.entries(s.val()).forEach(([name,tech])=>{
          const d=document.createElement('div');
          d.innerHTML=`<strong>${name}</strong>(${tech.year}) Cost:${tech.cost} RP | $${tech.moneyCost||100}
            <button class="editBtn" data-name="${name}" data-branch="${b}" data-tree="${t}">Edit</button>
            <button class="delBtn" data-name="${name}" data-branch="${b}" data-tree="${t}">Delete</button>`;
          itemsList.appendChild(d);
        });
      };

      // Edit/delete
      itemsList.onclick=async e=>{
        const btn=e.target;
        if(btn.classList.contains('editBtn')){
          const {tree,branch,name}=btn.dataset;
          await loadBranches(tree,branchSelect);
          treeSelect.value=tree; branchSelect.value=branch;
          const s=await get(ref(db,`research_tree/${tree}/${branch}/${name}`));
          if(!s.exists())return;
          const t=s.val();
          document.getElementById('nameInput').value=name;
          yearSelect.value=t.year; costInput.value=t.cost; moneyCostInput.value=t.moneyCost||100;
          imageInput.value=t.image; descInput.value=t.description||''; statsInput.value=t.stats||'';
          document.getElementById('prereqList').innerHTML='';
          (t.prerequisites||[]).forEach(n=>{
            const sp=document.createElement('span');
            sp.className='prereq-item'; sp.dataset.name=n; sp.textContent=n;
            const xb=document.createElement('button'); xb.textContent='x'; xb.onclick=()=>sp.remove();
            sp.append(xb); document.getElementById('prereqList').append(sp);
          });
          alert('Loaded');
        } else if(btn.classList.contains('delBtn')){
          const {tree,branch,name}=btn.dataset;
          if(confirm(`Delete ${name}?`)){
            await remove(ref(db,`research_tree/${tree}/${branch}/${name}`));
            alert('Deleted'); loadItemsBtn.click();
          }
        }
      };

      // Save nation
      saveNationBtn.onclick=async()=>{
        const na=nationNameInput.value.trim(); if(!na) return alert('Name required');
        const rp=+rpWeekInput.value, ba=+bankedInput.value, pa=nationPassInput.value.trim();
        const now=Math.floor(Date.now()/1000);
        const nr=ref(db,`nations/${na}`), sn=await get(nr);
        const un=sn.exists()?sn.val().unlocked||{}:{};
        await set(nr,{rp_per_week:rp,banked_rp:ba,last_update:now,password:pa||'default',unlocked:un});
        alert('Nation saved');
      };

      // Modal open/close
      addPrereqBtn.onclick=async()=>{
        allItems=[];
        const s=await get(ref(db,'research_tree'));
        if(s.exists())Object.entries(s.val()).forEach(([tr,brs])=>Object.entries(brs).forEach(([b,ts])=>Object.keys(ts).forEach(n=>allItems.push(n))));
        render(allItems);
        // Show modal
        prereqModal.style.display = 'flex';
        prereqModal.classList.add('visible');
      };
      closeBtns.forEach(cb=>cb.onclick=()=>{ prereqModal.classList.remove('visible'); prereqModal.style.display = 'none'; });
      prereqModal.onclick=e=>{ if(e.target===prereqModal){ prereqModal.classList.remove('visible'); prereqModal.style.display = 'none'; } };

      // Prereq modal logic
      let allItems=[];
      function render(list){ prereqResults.innerHTML=''; list.forEach(n=>{ const dv=document.createElement('div'); dv.textContent=n; dv.style.cursor='pointer'; dv.onclick=()=>{ if(![...modalSelected.children].some(c=>c.dataset.name===n)){ const sp=document.createElement('span'); sp.className='prereq-item'; sp.dataset.name=n; sp.textContent=n; const xb=document.createElement('button'); xb.textContent='x'; xb.onclick=()=>sp.remove(); sp.append(xb); modalSelected.append(sp);} }; prereqResults.append(dv); }); }
      prereqSearch.oninput=()=>render(allItems.filter(n=>n.toLowerCase().includes(prereqSearch.value.toLowerCase())));
      prereqDoneBtn.onclick=()=>{ const fl=document.getElementById('prereqList'); fl.innerHTML=''; [...modalSelected.children].forEach(c=>{ const nm=c.dataset.name; const sp=c.cloneNode(true); sp.querySelector('button').onclick=()=>sp.remove(); fl.append(sp); }); prereqModal.classList.remove('visible'); };

    });
  </script>
</body>
</html>
