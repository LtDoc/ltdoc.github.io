<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WW1 Tech Tree</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Ensure prereq text wraps */
    .prereq { 
      overflow-wrap: break-word; 
      word-break: break-word; 
      text-align: center;
    }
    /* Clamp description to 6 lines */
    .tech-desc {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      height: calc(1.3em * 6);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      border-top: 1px solid #d8cbb3;
      border-bottom: 1px solid #d8cbb3;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <div class="login">
    <h1>Nation Login</h1>
    <label>Nation:</label>
    <select id="nationSelect"></select><br><br>
    <label>Password:</label>
    <input type="password" id="nationPassword" placeholder="Enter password"><br><br>
    <button id="loginBtn">Enter</button>
  </div>

  <div class="nation-view hidden">
    <h1 id="nationName"></h1>
    <div id="rpStatus"></div>
    <button id="refreshBtn">Refresh Tree</button>
    <div id="treeWrapper"></div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { ref, get, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const nationSelect = document.getElementById('nationSelect');
    const nationPassword = document.getElementById('nationPassword');
    const loginBtn = document.getElementById('loginBtn');
    const nationNameEl = document.getElementById('nationName');
    const rpStatusEl = document.getElementById('rpStatus');
    const treeWrapper = document.getElementById('treeWrapper');
    const refreshBtn = document.getElementById('refreshBtn');

    let currentNation = null;

    // Load all nations into dropdown
    async function loadNationsList() {
      const snap = await get(ref(db, 'nations'));
      if (snap.exists()) {
        Object.keys(snap.val()).forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          nationSelect.appendChild(opt);
        });
      }
    }
    loadNationsList();

    loginBtn.addEventListener('click', tryNationLogin);

    async function tryNationLogin() {
      const name = nationSelect.value;
      const pass = nationPassword.value;
      const snap = await get(ref(db, `nations/${name}`));
      if (!snap.exists()) {
        alert('Nation not found!');
        return;
      }
      const data = snap.val();
      if (pass !== data.password) {
        alert('Incorrect password!');
        return;
      }
      currentNation = name;
      await renderNation(data);
    }

    async function renderNation(data) {
      // Update RP with real-time gain
      const now = Math.floor(Date.now() / 1000);
      const weeks = Math.floor((now - data.last_update) / (7 * 24 * 3600));
      if (weeks > 0) {
        const gained = weeks * data.rp_per_week;
        data.banked_rp += gained;
        await update(ref(db, `nations/${currentNation}`), {
          banked_rp: data.banked_rp,
          last_update: now
        });
      }

      nationNameEl.textContent = currentNation;
      rpStatusEl.textContent = `Banked RP: ${data.banked_rp} (+${data.rp_per_week}/week)`;

      // Load tech tree
      const treeSnap = await get(ref(db, 'research_tree'));
      const treeData = treeSnap.val() || {};

      treeWrapper.innerHTML = '';
      for (let tree in treeData) {
        const treeDiv = document.createElement('div');
        treeDiv.innerHTML = `<h2>${tree}</h2>`;

        for (let branch in treeData[tree]) {
          const branchDiv = document.createElement('div');
          branchDiv.innerHTML = `<h3>${branch}</h3>`;
          const container = document.createElement('div');
          container.classList.add('tree-container');

          // group by year
          const yearGroups = {};
          for (let name in treeData[tree][branch]) {
            const tech = treeData[tree][branch][name];
            if (!yearGroups[tech.year]) yearGroups[tech.year] = [];
            yearGroups[tech.year].push({ ...tech, name });
          }
          for (let year = 1850; year <= 1925; year++) {
            if (!yearGroups[year]) continue;
            const col = document.createElement('div');
            col.classList.add('year-column');
            col.innerHTML = `<h4>${year}</h4>`;
            yearGroups[year].forEach(tech => {
              const unlocked = data.unlocked?.[tech.name];
              const prereqs = tech.prerequisites || [];
              const ready = prereqs.every(r => data.unlocked?.[r]);
              const node = document.createElement('div');
              node.classList.add('tech-node');
              if (!unlocked && !ready) node.classList.add('locked');
              node.innerHTML = `
                <img src="${tech.image}" alt="${tech.name}">
                <div class="tech-title">${tech.name}</div>
                <div class="tech-cost">RP: ${tech.cost} | $${tech.moneyCost || 100}</div>
                <div class="tech-desc" title="${tech.description || ''}">${tech.description || ''}</div>
                <div class="tech-stats">${tech.stats || ''}</div>
                ${prereqs.length ? `<div class="prereq" title="Requirements: ${prereqs.join(', ')}">Req: ${prereqs.join(', ')}</div>` : ''}
                ${unlocked
                  ? '<div><strong>Unlocked</strong></div>'
                  : ready
                    ? `<button onclick="unlockTech('${currentNation}','${tech.name}',${tech.cost})">Unlock</button>`
                    : '<div>Locked</div>'}
              `;
              col.appendChild(node);
            });
            container.appendChild(col);
          }
          branchDiv.appendChild(container);
          treeDiv.appendChild(branchDiv);
        }
        treeWrapper.appendChild(treeDiv);
      }

      document.querySelector('.login').classList.add('hidden');
      document.querySelector('.nation-view').classList.remove('hidden');
    }

    window.unlockTech = async (nation, techName, cost) => {
      const statSnap = await get(ref(db, `nations/${nation}`));
      const nationData = statSnap.val();
      if (nationData.banked_rp < cost) {
        alert('Not enough RP!');
        return;
      }
      await update(ref(db, `nations/${nation}`), {
        banked_rp: nationData.banked_rp - cost,
        [`unlocked/${techName}`]: true
      });
      alert(`${techName} unlocked!`);
      refreshTree();
    };

    refreshBtn.addEventListener('click', async () => {
      if (!currentNation) return;
      const snap = await get(ref(db, `nations/${currentNation}`));
      await renderNation(snap.val());
    });
  </script>
</body>
</html>
