<!DOCTYPE html>
<html>
<head>
  <title>WW1 Tech Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login">
    <h1>Nation Login</h1>
    <label>Nation:</label>
    <select id="nationSelect"></select><br><br>
    <label>Password:</label>
    <input type="password" id="nationPassword" placeholder="Enter password"><br><br>
    <button id="loginBtn">Enter</button>
  </div>

  <div class="nation-view hidden">
    <h1 id="nationName"></h1>
    <div id="rpStatus"></div>
    <button id="refreshBtn">Refresh Tree</button>
    <div id="treeWrapper"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCo9QPVrLCXS6li_kcTu3e-GOoiiwpHvLs",
      authDomain: "woe-world.firebaseapp.com",
      databaseURL: "https://woe-world-default-rtdb.firebaseio.com",
      projectId: "woe-world",
      storageBucket: "woe-world.appspot.com",
      messagingSenderId: "706865712365",
      appId: "1:706865712365:web:e080b1ef45b8d8b27190e4",
      measurementId: "G-789BN2WECG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentNation = null;

    async function loadNationsList() {
      const snapshot = await get(ref(db, 'nations'));
      const nations = snapshot.val() || {};
      const select = document.getElementById('nationSelect');
      select.innerHTML = '';
      for (const name in nations) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const selectedNation = document.getElementById('nationSelect').value;
      const enteredPass = document.getElementById('nationPassword').value;
      const nationRef = ref(db, `nations/${selectedNation}`);
      const nationSnap = await get(nationRef);
      if (!nationSnap.exists()) {
        alert('Nation not found!');
        return;
      }
      const nationData = nationSnap.val();
      if (enteredPass !== nationData.password) {
        alert('Incorrect password!');
        return;
      }
      currentNation = selectedNation;
      loadNation(nationData);
    });

    async function loadNation(nationData) {
      const now = Math.floor(Date.now()/1000);
      const weeksPassed = Math.floor((now - nationData.last_update) / (7*24*3600));
      if (weeksPassed > 0) {
        nationData.banked_rp += weeksPassed * nationData.rp_per_week;
        nationData.last_update = now;
        await update(ref(db, `nations/${currentNation}`), {
          banked_rp: nationData.banked_rp,
          last_update: now
        });
      }

      document.querySelector('.login').classList.add('hidden');
      document.querySelector('.nation-view').classList.remove('hidden');
      document.getElementById('nationName').textContent = currentNation;
      document.getElementById('rpStatus').textContent = `Banked RP: ${nationData.banked_rp} (+${nationData.rp_per_week}/week)`;

      const treeSnap = await get(ref(db, 'research_tree'));
      const treeData = treeSnap.val() || {};

      const wrapper = document.getElementById('treeWrapper');
      wrapper.innerHTML = '';
      for (let tree in treeData) {
        let treeDiv = document.createElement('div');
        treeDiv.innerHTML = `<h2>${tree}</h2>`;
        for (let branch in treeData[tree]) {
          let branchDiv = document.createElement('div');
          branchDiv.innerHTML = `<h3>${branch}</h3>`;
          let yearGroups = {};
          for (let item in treeData[tree][branch]) {
            let tech = treeData[tree][branch][item];
            if (!yearGroups[tech.year]) yearGroups[tech.year] = [];
            yearGroups[tech.year].push({ name: item, ...tech });
          }
          let branchContainer = document.createElement('div');
          branchContainer.classList.add('tree-container');
          for (let year = 1850; year <= 1925; year++) {
            if (!yearGroups[year]) continue;
            let yearCol = document.createElement('div');
            yearCol.classList.add('year-column');
            yearCol.innerHTML = `<h4>${year}</h4>`;
            yearGroups[year].forEach(tech => {
              const unlocked = nationData.unlocked?.[tech.name] || false;
              const prereqs = tech.prerequisites || [];
              const prereqsMet = prereqs.every(req => nationData.unlocked?.[req]);
              let node = document.createElement('div');
              node.classList.add('tech-node');
              if (!unlocked && !prereqsMet) node.classList.add('locked');
              node.innerHTML = \`
                <img src="\${tech.image}" alt="\${tech.name}">
                <div class="tech-title">\${tech.name}</div>
                <div class="tech-cost">RP: \${tech.cost} | $\${tech.moneyCost || 100}</div>
                <div class="tech-desc" title="\${tech.description || ''}">\${tech.description || ''}</div>
                <div class="tech-stats">\${tech.stats || ''}</div>
                \${prereqs.length > 0 ? \`<div class="prereq">Req: \${prereqs.join(', ')}</div>\` : ''}
                \${unlocked ? '<div><strong>Unlocked</strong></div>' :
                  (prereqsMet ? \`<button onclick="unlockTech('\${currentNation}','\${tech.name}',\${tech.cost})">Unlock</button>\` :
                  '<div>Locked</div>')}\`;
              yearCol.appendChild(node);
            });
            branchContainer.appendChild(yearCol);
          }
          branchDiv.appendChild(branchContainer);
          treeDiv.appendChild(branchDiv);
        }
        wrapper.appendChild(treeDiv);
      }
    }

    window.unlockTech = async function(nation, techName, cost) {
      const nationRef = ref(db, `nations/${nation}`);
      const snap = await get(nationRef);
      const nationData = snap.val();
      if (nationData.banked_rp < cost) {
        alert('Not enough RP!');
        return;
      }
      await update(nationRef, {
        banked_rp: nationData.banked_rp - cost,
        [\`unlocked/\${techName}\`]: true
      });
      alert(\`\${techName} unlocked!\`);
      document.getElementById('refreshBtn').click();
    };

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      if (!currentNation) return;
      const nationSnap = await get(ref(db, `nations/\${currentNation}`));
      if (!nationSnap.exists()) return;
      loadNation(nationSnap.val());
    });

    loadNationsList();
  </script>
</body>
</html>
